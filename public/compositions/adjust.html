<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Adjust lockups</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eeeeee;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="adjust"
      data-start="0"
      data-width="1200"
      data-height="720"
      style="
        position: relative;
        width: 1200px;
        height: 720px;
        overflow: hidden;
        background: #eeeeee;
        color: #0a0a0a;
      "
    >
      <div
        class="clip"
        data-start="0"
        data-duration="4.55"
        data-track-index="0"
        style="position: absolute; inset: 0"
      >
        <div
          style="
            position: absolute;
            inset: 40px 56px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
          "
        >
          <!-- Horizontal -->
          <div
            style="
              background: #fff;
              border-radius: 20px;
              padding: 24px;
              display: flex;
              flex-direction: column;
              gap: 16px;
            "
          >
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 17px; font-weight: 650">Horizontal</span>
              <div
                style="
                  display: flex;
                  gap: 4px;
                  background: #f3f3f3;
                  border-radius: 999px;
                  padding: 4px;
                "
              >
                <span class="pill-h" style="width: 34px; height: 34px; border-radius: 999px; background: transparent"></span>
                <span class="pill-h" style="width: 34px; height: 34px; border-radius: 999px; background: #0a0a0a"></span>
                <span class="pill-h" style="width: 34px; height: 34px; border-radius: 999px; background: transparent"></span>
              </div>
            </div>
            <div
              style="
                flex: 1;
                background: #f3f3f3;
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <div
                id="row-h"
                style="
                  display: flex;
                  flex-direction: row;
                  align-items: center;
                  gap: 24px;
                "
              >
                <div
                  id="icon-h"
                  style="
                    width: 64px;
                    height: 64px;
                    border: 3px solid #0a0a0a;
                    border-radius: 10px;
                    box-sizing: border-box;
                    flex-shrink: 0;
                  "
                ></div>
                <div
                  id="word-h"
                  style="
                    width: 180px;
                    height: 28px;
                    background: #0a0a0a;
                    border-radius: 8px;
                    flex-shrink: 0;
                  "
                ></div>
              </div>
            </div>
            <div>
              <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5f5f5f; margin-bottom: 8px">
                <span>Gap</span>
                <span id="gap-h-label">24px</span>
              </div>
              <div style="position: relative; height: 16px; display: flex; align-items: center">
                <div style="height: 8px; width: 100%; background: #e8e8e8; border-radius: 999px; position: relative">
                  <div id="gap-h-fill" style="position: absolute; left: 0; top: 0; bottom: 0; width: 30%; background: #0a0a0a; border-radius: 999px"></div>
                </div>
                <div id="gap-h-knob" style="position: absolute; top: 0; left: 30%; width: 16px; height: 16px; margin-left: -8px; box-sizing: border-box; background: #fff; border: 2px solid #0a0a0a; border-radius: 999px"></div>
              </div>
            </div>
          </div>

          <!-- Vertical -->
          <div
            style="
              background: #fff;
              border-radius: 20px;
              padding: 24px;
              display: flex;
              flex-direction: column;
              gap: 16px;
            "
          >
            <div style="display: flex; align-items: center; justify-content: space-between">
              <span style="font-size: 17px; font-weight: 650">Vertical</span>
              <div
                style="
                  display: flex;
                  gap: 4px;
                  background: #f3f3f3;
                  border-radius: 999px;
                  padding: 4px;
                "
              >
                <span class="pill-v" style="width: 34px; height: 34px; border-radius: 999px; background: transparent"></span>
                <span class="pill-v" style="width: 34px; height: 34px; border-radius: 999px; background: #0a0a0a"></span>
                <span class="pill-v" style="width: 34px; height: 34px; border-radius: 999px; background: transparent"></span>
              </div>
            </div>
            <div
              style="
                flex: 1;
                background: #f3f3f3;
                border-radius: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <div
                id="col-v"
                style="
                  display: flex;
                  flex-direction: column;
                  align-items: center;
                  gap: 16px;
                "
              >
                <div
                  id="icon-v"
                  style="
                    width: 52px;
                    height: 52px;
                    border: 3px solid #0a0a0a;
                    border-radius: 10px;
                    box-sizing: border-box;
                    flex-shrink: 0;
                  "
                ></div>
                <div
                  id="word-v"
                  style="
                    width: 150px;
                    height: 26px;
                    background: #0a0a0a;
                    border-radius: 8px;
                    flex-shrink: 0;
                  "
                ></div>
              </div>
            </div>
            <div>
              <div style="display: flex; justify-content: space-between; font-size: 13px; color: #5f5f5f; margin-bottom: 8px">
                <span>Gap</span>
                <span id="gap-v-label">16px</span>
              </div>
              <div style="position: relative; height: 16px; display: flex; align-items: center">
                <div style="height: 8px; width: 100%; background: #e8e8e8; border-radius: 999px; position: relative">
                  <div id="gap-v-fill" style="position: absolute; left: 0; top: 0; bottom: 0; width: 22%; background: #0a0a0a; border-radius: 999px"></div>
                </div>
                <div id="gap-v-knob" style="position: absolute; top: 0; left: 22%; width: 16px; height: 16px; margin-left: -8px; box-sizing: border-box; background: #fff; border: 2px solid #0a0a0a; border-radius: 999px"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const gapHLabel = document.getElementById("gap-h-label");
        const gapVLabel = document.getElementById("gap-v-label");
        const pillsH = Array.from(document.querySelectorAll(".pill-h"));
        const pillsV = Array.from(document.querySelectorAll(".pill-v"));

        function setPills(pills, active) {
          pills.forEach((p, i) => {
            p.style.background = i === active ? "#0a0a0a" : "transparent";
          });
        }

        tl.from("#icon-h, #word-h, #icon-v, #word-v", {
          opacity: 0,
          y: 8,
          duration: 0.4,
          stagger: 0.05,
        }, 0.15);

        // Gap both orientations
        tl.to("#row-h", { gap: 44, duration: 1.15, ease: "power2.inOut" }, 0.85);
        tl.to("#gap-h-fill", { width: "55%", duration: 1.15, ease: "power2.inOut" }, 0.85);
        tl.to("#gap-h-knob", { left: "55%", duration: 1.15, ease: "power2.inOut" }, 0.85);
        tl.to("#col-v", { gap: 34, duration: 1.15, ease: "power2.inOut" }, 0.85);
        tl.to("#gap-v-fill", { width: "48%", duration: 1.15, ease: "power2.inOut" }, 0.85);
        tl.to("#gap-v-knob", { left: "48%", duration: 1.15, ease: "power2.inOut" }, 0.85);
        tl.to(
          {},
          {
            duration: 1.15,
            onUpdate() {
              const h = parseFloat(gsap.getProperty("#gap-h-fill", "width"));
              const v = parseFloat(gsap.getProperty("#gap-v-fill", "width"));
              gapHLabel.textContent = Math.round(12 + (h / 100) * 60) + "px";
              gapVLabel.textContent = Math.round(8 + (v / 100) * 50) + "px";
            },
          },
          0.85,
        );

        // Align icon ↔ wordmark by sliding (not snapping alignItems)
        // Horizontal: wordmark drops to bottom of icon
        tl.to("#word-h", { y: 18, duration: 0.6, ease: "power2.inOut" }, 2.2);
        // Vertical: icon slides to the right edge of the wordmark
        tl.to("#icon-v", { x: 49, duration: 0.6, ease: "power2.inOut" }, 2.2);
        tl.call(() => {
          setPills(pillsH, 2);
          setPills(pillsV, 2);
        }, null, 2.2);

        tl.to("#word-h", { y: 0, duration: 0.6, ease: "power2.inOut" }, 3.15);
        tl.to("#icon-v", { x: 0, duration: 0.6, ease: "power2.inOut" }, 3.15);
        tl.call(() => {
          setPills(pillsH, 1);
          setPills(pillsV, 1);
        }, null, 3.15);

        tl.to("#row-h", { gap: 24, duration: 1.0, ease: "power2.inOut" }, 3.55);
        tl.to("#gap-h-fill", { width: "30%", duration: 1.0, ease: "power2.inOut" }, 3.55);
        tl.to("#gap-h-knob", { left: "30%", duration: 1.0, ease: "power2.inOut" }, 3.55);
        tl.to("#col-v", { gap: 16, duration: 1.0, ease: "power2.inOut" }, 3.55);
        tl.to("#gap-v-fill", { width: "22%", duration: 1.0, ease: "power2.inOut" }, 3.55);
        tl.to("#gap-v-knob", { left: "22%", duration: 1.0, ease: "power2.inOut" }, 3.55);

        window.__timelines = window.__timelines || {};
        window.__timelines["adjust"] = tl;
        const clip = document.querySelector(".clip");
        if (clip && tl.duration() > 0) {
          clip.setAttribute("data-duration", String(Number(tl.duration().toFixed(3))));
        }
      </script>
    </div>
  </body>
</html>
