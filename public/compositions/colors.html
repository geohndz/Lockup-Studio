<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add colors</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eeeeee;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="colors"
      data-start="0"
      data-width="1200"
      data-height="720"
      style="
        position: relative;
        width: 1200px;
        height: 720px;
        overflow: hidden;
        background: #eeeeee;
        color: #0a0a0a;
      "
    >
      <div
        class="clip"
        data-start="0"
        data-duration="4.95"
        data-track-index="0"
        style="position: absolute; inset: 0"
      >
        <div style="position: absolute; inset: 40px 56px; display: flex; flex-direction: column; gap: 18px">
          <div style="display: flex; justify-content: flex-end">
            <div
              id="add-btn"
              style="
                height: 48px;
                padding: 0 22px;
                border-radius: 999px;
                background: #fff;
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 15px;
                font-weight: 600;
              "
            >
              <span style="font-size: 20px; line-height: 1">+</span>
              Add color
            </div>
          </div>

          <div
            id="palette"
            style="
              flex: 1;
              display: flex;
              min-height: 0;
              border-radius: 20px;
              overflow: hidden;
              background: #eeeeee;
            "
          >
            <div class="stripe" style="flex: 1; background: #16463a; position: relative">
              <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; color: #fff">
                <p style="margin: 0; font-size: 18px; font-weight: 650">Forest</p>
                <p style="margin: 6px 0 0; font-size: 13px; opacity: 0.75">Primary</p>
              </div>
            </div>
            <div class="stripe" style="flex: 1; background: #ede6d6; position: relative">
              <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; color: #14110f">
                <p style="margin: 0; font-size: 18px; font-weight: 650">Sand</p>
                <p style="margin: 6px 0 0; font-size: 13px; opacity: 0.55">Secondary</p>
              </div>
            </div>
            <div
              id="new-stripe"
              class="stripe"
              style="flex: 0; width: 0; background: #c2410c; position: relative; overflow: hidden; opacity: 0"
            >
              <div style="position: absolute; left: 20px; right: 20px; bottom: 24px; color: #fff; white-space: nowrap">
                <p style="margin: 0; font-size: 18px; font-weight: 650">Clay</p>
                <p style="margin: 6px 0 0; font-size: 13px; opacity: 0.75">Tertiary</p>
              </div>
            </div>
          </div>
        </div>

        <div
          id="picker"
          style="
            position: absolute;
            top: 108px;
            right: 80px;
            width: 260px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
            padding: 14px;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
          "
        >
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px">
            <span style="font-size: 13px; font-weight: 650">Custom</span>
            <span style="width: 28px; height: 28px; border-radius: 999px; background: #f3f3f3"></span>
          </div>
          <div
            id="sv"
            style="
              aspect-ratio: 1;
              border-radius: 10px;
              background: linear-gradient(to top, #000, transparent),
                linear-gradient(to right, #fff, #c2410c);
              position: relative;
            "
          >
            <span
              id="sv-knob"
              style="
                position: absolute;
                left: 72%;
                top: 28%;
                width: 14px;
                height: 14px;
                margin: -7px 0 0 -7px;
                border-radius: 999px;
                border: 2px solid #fff;
                box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35);
                background: #c2410c;
              "
            ></span>
          </div>
          <div
            id="confirm"
            style="
              margin-top: 14px;
              height: 36px;
              border-radius: 9px;
              background: #0a0a0a;
              color: #fff;
              display: flex;
              align-items: center;
              justify-content: center;
              font-size: 13px;
              font-weight: 600;
            "
          >
            Add color
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(".stripe", { opacity: 0, y: 14, duration: 0.7, stagger: 0.12 }, 0.2);
        tl.to("#add-btn", { scale: 0.97, duration: 0.18, yoyo: true, repeat: 1 }, 1.5);
        tl.to("#picker", { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.7);
        tl.to("#sv-knob", { left: "62%", top: "38%", duration: 1.4, ease: "power2.inOut" }, 2.2);
        tl.to("#confirm", { scale: 0.97, duration: 0.16, yoyo: true, repeat: 1 }, 3.7);
        tl.to("#picker", { opacity: 0, y: 10, duration: 0.35 }, 3.95);
        tl.to(
          "#new-stripe",
          { flex: 1, width: "auto", opacity: 1, duration: 0.85, ease: "power2.out" },
          4.1,
        );
        window.__timelines = window.__timelines || {};
        window.__timelines["colors"] = tl;
        const clip = document.querySelector(".clip");
        if (clip && tl.duration() > 0) {
          clip.setAttribute("data-duration", String(Number(tl.duration().toFixed(3))));
        }
      </script>
    </div>
  </body>
</html>
