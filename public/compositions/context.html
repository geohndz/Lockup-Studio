<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>In context</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eeeeee;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="context"
      data-start="0"
      data-width="1200"
      data-height="720"
      style="
        position: relative;
        width: 1200px;
        height: 720px;
        overflow: hidden;
        background: #eeeeee;
        color: #0a0a0a;
      "
    >
      <div
        class="clip"
        data-start="0"
        data-duration="4.95"
        data-track-index="0"
        style="position: absolute; inset: 0"
      >
        <div
          style="
            position: absolute;
            inset: 36px 56px;
            display: grid;
            grid-template-columns: 1.25fr 0.75fr;
            gap: 18px;
          "
        >
            <!-- Left stack: nav + business card -->
            <div style="display: flex; flex-direction: column; gap: 16px; min-height: 0">
              <div
                class="card"
                style="
                  background: #fff;
                  border-radius: 20px;
                  padding: 18px;
                  display: flex;
                  flex-direction: column;
                  gap: 12px;
                  flex: 0 0 auto;
                "
              >
                <div style="display: flex; justify-content: space-between; align-items: center">
                  <span style="font-size: 15px; font-weight: 650">Website navigation</span>
                  <span style="font-size: 12px; color: #6b6b6b">Horizontal</span>
                </div>
                <div
                  id="nav"
                  style="
                    height: 72px;
                    background: #16463a;
                    display: flex;
                    align-items: center;
                    justify-content: space-between;
                    padding: 0 22px;
                    color: #fff;
                  "
                >
                  <div style="display: flex; align-items: center; gap: 10px">
                    <div style="width: 24px; height: 24px; border: 2px solid #fff; border-radius: 5px; box-sizing: border-box"></div>
                    <div style="width: 96px; height: 12px; background: #fff; border-radius: 3px"></div>
                  </div>
                  <div style="display: flex; gap: 18px; font-size: 12px; opacity: 0.8">
                    <span>Work</span><span>About</span><span>Contact</span>
                  </div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="width: 22px; height: 22px; border-radius: 999px; background: #fff; box-shadow: inset 0 0 0 1px #e0e0e0"></span>
                  <span id="swatch-bg" style="width: 22px; height: 22px; border-radius: 999px; background: #16463a; outline: 2px solid #0a0a0a; outline-offset: 2px"></span>
                  <span style="width: 1px; height: 14px; background: #e0e0e0; margin: 0 4px"></span>
                  <span style="width: 18px; height: 18px; border-radius: 999px; background: #16463a"></span>
                  <span style="width: 18px; height: 18px; border-radius: 999px; background: #ede6d6; box-shadow: inset 0 0 0 1px #e0e0e0"></span>
                  <span style="width: 18px; height: 18px; border-radius: 999px; background: #c2410c"></span>
                </div>
              </div>

              <div
                class="card"
                style="
                  background: #fff;
                  border-radius: 20px;
                  padding: 18px;
                  display: flex;
                  flex-direction: column;
                  gap: 12px;
                  flex: 1;
                  min-height: 0;
                "
              >
                <div style="display: flex; justify-content: space-between; align-items: center">
                  <span style="font-size: 15px; font-weight: 650">Business card</span>
                  <span style="font-size: 12px; color: #6b6b6b">Horizontal</span>
                </div>
                <div
                  style="
                    flex: 1;
                    background: #f3f3f3;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    padding: 16px;
                    min-height: 0;
                  "
                >
                  <div
                    id="card-face"
                    style="
                      width: 78%;
                      aspect-ratio: 1.75 / 1;
                      max-height: 100%;
                      background: #16463a;
                      color: #fff;
                      padding: 18px;
                      box-sizing: border-box;
                      display: flex;
                      flex-direction: column;
                      justify-content: space-between;
                    "
                  >
                    <div style="display: flex; align-items: center; gap: 8px">
                      <div style="width: 18px; height: 18px; border: 2px solid #fff; border-radius: 4px"></div>
                      <div style="width: 72px; height: 10px; background: #fff; border-radius: 3px"></div>
                    </div>
                    <div>
                      <p style="margin: 0; font-size: 14px; font-weight: 650">Valterra</p>
                      <p style="margin: 4px 0 0; font-size: 10px; opacity: 0.65">hello@valterra.com</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Right: phone -->
            <div
              class="card"
              style="
                background: #fff;
                border-radius: 20px;
                padding: 18px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                min-height: 0;
              "
            >
              <div style="display: flex; justify-content: space-between; align-items: center">
                <span style="font-size: 15px; font-weight: 650">App icon</span>
                <span style="font-size: 12px; color: #6b6b6b">Icon</span>
              </div>
              <div
                style="
                  flex: 1;
                  background: #f3f3f3;
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  min-height: 0;
                "
              >
                <div
                  id="phone"
                  style="
                    height: 92%;
                    aspect-ratio: 9 / 19;
                    border-radius: 28px;
                    background: #111;
                    padding: 6px;
                    box-sizing: border-box;
                  "
                >
                  <div
                    id="phone-screen"
                    style="
                      height: 100%;
                      border-radius: 22px;
                      background: linear-gradient(165deg, #1c1410 0%, #16463abb 58%, #16463a 100%);
                      display: flex;
                      flex-direction: column;
                      padding: 14px 12px 10px;
                      box-sizing: border-box;
                    "
                  >
                    <div style="display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 10px; font-weight: 600">
                      <span>9:41</span>
                      <div style="width: 48px; height: 14px; background: #000; border-radius: 999px"></div>
                      <div style="width: 14px; height: 8px; border: 1px solid rgba(255,255,255,0.85); border-radius: 2px"></div>
                    </div>
                    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 18px">
                      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
                        <div id="app-icon" style="width: 100%; aspect-ratio: 1; border-radius: 22%; background: #16463a; display: flex; align-items: center; justify-content: center">
                          <div style="width: 42%; height: 42%; border: 2px solid #fff; border-radius: 6px; box-sizing: border-box"></div>
                        </div>
                        <span style="width: 70%; height: 4px; background: rgba(255,255,255,0.45); border-radius: 999px"></span>
                      </div>
                      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
                        <div style="width: 100%; aspect-ratio: 1; border-radius: 22%; background: rgba(255,255,255,0.9)"></div>
                        <span style="width: 70%; height: 4px; background: rgba(255,255,255,0.35); border-radius: 999px"></span>
                      </div>
                      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
                        <div style="width: 100%; aspect-ratio: 1; border-radius: 22%; background: rgba(255,255,255,0.25)"></div>
                        <span style="width: 70%; height: 4px; background: rgba(255,255,255,0.25); border-radius: 999px"></span>
                      </div>
                      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
                        <div style="width: 100%; aspect-ratio: 1; border-radius: 22%; background: rgba(255,255,255,0.2)"></div>
                        <span style="width: 60%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 999px"></span>
                      </div>
                    </div>
                    <div style="margin-top: auto; display: flex; justify-content: center">
                      <div style="width: 72px; height: 4px; background: rgba(255,255,255,0.5); border-radius: 999px"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.from(".card", { opacity: 0, y: 14, duration: 0.55, stagger: 0.1 }, 0.15);
        tl.to("#nav", { backgroundColor: "#c2410c", duration: 0.85, ease: "power2.inOut" }, 1.4);
        tl.to("#swatch-bg", { backgroundColor: "#c2410c", duration: 0.85, ease: "power2.inOut" }, 1.4);
        tl.to("#card-face", { backgroundColor: "#c2410c", duration: 0.85, ease: "power2.inOut" }, 1.55);
        tl.to("#app-icon", { backgroundColor: "#c2410c", duration: 0.85, ease: "power2.inOut" }, 1.55);
        tl.to("#phone-screen", { background: "linear-gradient(165deg, #1c1410 0%, #c2410cbb 58%, #c2410c 100%)", duration: 0.85, ease: "power2.inOut" }, 1.55);

        tl.to("#nav", { backgroundColor: "#0a0a0a", duration: 0.85, ease: "power2.inOut" }, 2.7);
        tl.to("#swatch-bg", { backgroundColor: "#0a0a0a", duration: 0.85, ease: "power2.inOut" }, 2.7);
        tl.to("#card-face", { backgroundColor: "#0a0a0a", duration: 0.85, ease: "power2.inOut" }, 2.85);
        tl.to("#app-icon", { backgroundColor: "#0a0a0a", duration: 0.85, ease: "power2.inOut" }, 2.85);
        tl.to("#phone-screen", { background: "linear-gradient(165deg, #1c1410 0%, #333 58%, #0a0a0a 100%)", duration: 0.85, ease: "power2.inOut" }, 2.85);

        tl.to("#nav", { backgroundColor: "#16463a", duration: 0.85, ease: "power2.inOut" }, 4.0);
        tl.to("#swatch-bg", { backgroundColor: "#16463a", duration: 0.85, ease: "power2.inOut" }, 4.0);
        tl.to("#card-face", { backgroundColor: "#16463a", duration: 0.85, ease: "power2.inOut" }, 4.1);
        tl.to("#app-icon", { backgroundColor: "#16463a", duration: 0.85, ease: "power2.inOut" }, 4.1);
        tl.to("#phone-screen", { background: "linear-gradient(165deg, #1c1410 0%, #16463abb 58%, #16463a 100%)", duration: 0.85, ease: "power2.inOut" }, 4.1);

        window.__timelines = window.__timelines || {};
        window.__timelines["context"] = tl;
        const clip = document.querySelector(".clip");
        if (clip && tl.duration() > 0) {
          clip.setAttribute("data-duration", String(Number(tl.duration().toFixed(3))));
        }
      </script>
    </div>
  </body>
</html>
