<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Export package</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #eeeeee;
        font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="export"
      data-start="0"
      data-width="1200"
      data-height="720"
      style="
        position: relative;
        width: 1200px;
        height: 720px;
        overflow: hidden;
        background: #eeeeee;
        color: #0a0a0a;
      "
    >
      <div
        class="clip"
        data-start="0"
        data-duration="4.3"
        data-track-index="0"
        style="position: absolute; inset: 0"
      >
        <!-- Studio skeleton background -->
        <div
          style="
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #eeeeee;
          "
        >
          <div
            style="
              height: 72px;
              background: #fff;
              border-bottom: 1px solid #e0e0e0;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 36px;
            "
          >
            <div>
              <div style="width: 52px; height: 10px; background: #e8e8e8; border-radius: 4px"></div>
              <div style="width: 120px; height: 18px; background: #ddd; border-radius: 5px; margin-top: 8px"></div>
            </div>
            <div style="width: 72px; height: 28px; background: #f3f3f3; border-radius: 999px"></div>
          </div>

          <div style="flex: 1; display: flex; min-height: 0">
            <div
              style="
                width: 220px;
                background: #fff;
                border-right: 1px solid #e0e0e0;
                padding: 22px 18px;
                box-sizing: border-box;
              "
            >
              <div style="width: 100%; height: 40px; background: #f3f3f3; border-radius: 12px"></div>
              <div style="width: 70%; height: 12px; background: #ececec; border-radius: 4px; margin-top: 22px"></div>
              <div style="width: 100%; height: 64px; background: #f3f3f3; border-radius: 12px; margin-top: 14px"></div>
              <div style="width: 100%; height: 64px; background: #f3f3f3; border-radius: 12px; margin-top: 12px"></div>
              <div style="width: 100%; height: 64px; background: #f3f3f3; border-radius: 12px; margin-top: 12px"></div>
            </div>
            <div style="flex: 1; padding: 28px 32px; box-sizing: border-box">
              <div style="width: 90px; height: 12px; background: #ddd; border-radius: 4px"></div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 16px">
                <div style="height: 160px; background: #fff; border-radius: 16px"></div>
                <div style="height: 160px; background: #fff; border-radius: 16px"></div>
              </div>
              <div style="width: 70px; height: 12px; background: #ddd; border-radius: 4px; margin-top: 28px"></div>
              <div style="height: 120px; background: #fff; border-radius: 16px; margin-top: 14px; display: flex; overflow: hidden">
                <div style="flex: 1; background: #16463a"></div>
                <div style="flex: 1; background: #ede6d6"></div>
              </div>
            </div>
          </div>

          <div
            style="
              height: 76px;
              background: #fff;
              border-top: 1px solid #e0e0e0;
              display: flex;
              align-items: center;
              justify-content: space-between;
              padding: 0 28px;
            "
          >
            <div style="width: 240px; height: 12px; background: #e8e8e8; border-radius: 4px"></div>
            <div
              id="generate"
              style="
                height: 54px;
                padding: 0 28px;
                border-radius: 999px;
                background: #0a0a0a;
                color: #fff;
                display: flex;
                align-items: center;
                font-size: 15px;
                font-weight: 650;
              "
            >
              Generate Lockup Package
            </div>
          </div>
        </div>

        <div
          id="backdrop"
          style="
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.28);
            opacity: 0;
          "
        ></div>

        <div
          id="modal"
          style="
            position: absolute;
            left: 50%;
            top: 50%;
            width: 520px;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
            transform: translate(-50%, -46%) scale(0.96);
            opacity: 0;
            overflow: hidden;
          "
        >
          <div style="padding: 28px 28px 18px; padding-right: 64px">
            <p style="margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.02em">
              Export package
            </p>
            <p style="margin: 8px 0 0; font-size: 14px; color: #6b6b6b; line-height: 1.45">
              SVG + PNG lockups, named and sorted for your client.
            </p>
          </div>
          <div style="padding: 0 28px 24px">
            <div
              style="
                background: #f3f3f3;
                border-radius: 14px;
                padding: 16px 18px;
                font-size: 13px;
                line-height: 1.7;
                color: #5f5f5f;
              "
            >
              <div style="font-weight: 650; color: #0a0a0a; margin-bottom: 6px">Valterra/</div>
              <div style="padding-left: 14px">Logos/</div>
              <div id="tree-svg" style="padding-left: 28px; opacity: 0">SVG/ · Horizontal, Icon…</div>
              <div id="tree-png" style="padding-left: 28px; opacity: 0">PNG/ · 256–2048</div>
              <div
                id="tree-count"
                style="padding-left: 14px; margin-top: 8px; opacity: 0; color: #0a0a0a; font-weight: 600"
              >
                48 files · ~2.4 MB
              </div>
            </div>
          </div>
          <div
            style="
              border-top: 1px solid #e0e0e0;
              padding: 16px 28px;
              display: flex;
              justify-content: flex-end;
              gap: 10px;
            "
          >
            <div
              style="
                height: 48px;
                padding: 0 20px;
                border-radius: 999px;
                background: #f3f3f3;
                display: flex;
                align-items: center;
                font-weight: 600;
                font-size: 14px;
              "
            >
              Cancel
            </div>
            <div
              id="download"
              style="
                height: 48px;
                padding: 0 22px;
                border-radius: 999px;
                background: #0a0a0a;
                color: #fff;
                display: flex;
                align-items: center;
                font-weight: 650;
                font-size: 14px;
              "
            >
              Download ZIP
            </div>
          </div>
        </div>
      </div>

      <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const download = document.getElementById("download");

        tl.to("#generate", { scale: 0.97, duration: 0.16, yoyo: true, repeat: 1 }, 0.7);
        tl.to("#backdrop", { opacity: 1, duration: 0.4 }, 0.95);
        tl.fromTo(
          "#modal",
          { opacity: 0, transform: "translate(-50%, -46%) scale(0.96)" },
          {
            opacity: 1,
            transform: "translate(-50%, -50%) scale(1)",
            duration: 0.55,
            ease: "power2.out",
          },
          1.0,
        );
        tl.to("#tree-svg", { opacity: 1, duration: 0.4 }, 1.7);
        tl.to("#tree-png", { opacity: 1, duration: 0.4 }, 2.1);
        tl.to("#tree-count", { opacity: 1, duration: 0.45 }, 2.55);
        tl.to("#download", { scale: 0.97, duration: 0.16, yoyo: true, repeat: 1 }, 3.6);
        tl.to(
          "#download",
          {
            backgroundColor: "#1b7a3d",
            duration: 0.4,
            onStart() {
              download.textContent = "Downloaded";
            },
          },
          3.9,
        );

        window.__timelines = window.__timelines || {};
        window.__timelines["export"] = tl;
        const clip = document.querySelector(".clip");
        if (clip && tl.duration() > 0) {
          clip.setAttribute("data-duration", String(Number(tl.duration().toFixed(3))));
        }
      </script>
    </div>
  </body>
</html>
